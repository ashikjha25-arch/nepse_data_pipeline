services:
  api:
    build: .
    container_name: nepse_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - kafka

  producer:
    build: .
    container_name: nepse_producer
    depends_on:
      prev_data_loader:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    command: python -m app.run_producer
    env_file:
      - .env

  # consumer:
  #   build: .
  #   container_name: nepse_consumer
  #   command: python -m app.run_consumer
  #   env_file:
  #     - .env
  #   depends_on:
  #     - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    env_file:
      - .env
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - kafka
    command: >
      bash -c "
      sleep 15 &&
      /usr/bin/kafka-topics --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic nepse-topic
      --partitions 1
      --replication-factor 1
      "

  postgres:
    image: postgres:16
    container_name: nepse_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  spark:
    image: apache/spark:3.5.1
    container_name: nepse_spark
    user: root
    depends_on:
      - kafka-init
      - postgres
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "/opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      spark_jobs/stream_processor.py"

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=volkovlabs-echarts-panel,yesoreyeram-infinity-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Mount the actual dashboard JSON files
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - postgres

  ml_service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
    restart: always

  prev_data_loader:
    image: curlimages/curl:latest
    container_name: nepse_prev_data_loader
    depends_on:
      - api
      - spark
      - kafka
    command: >
      sh -c "
      sleep 20 &&
      curl -f http://api:8000/store/prev_data &&
      echo 'Previous data loaded successfully'
      "
    restart: "no"

volumes:
  postgres_data:
  grafana_data: