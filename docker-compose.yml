services:
  api:
    build: .
    container_name: nepse_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - kafka

  producer:
    build: .
    container_name: nepse_producer
    command: python -m app.run_producer
    env_file:
      - .env
    depends_on:
      - kafka

  # consumer:
  #   build: .
  #   container_name: nepse_consumer
  #   command: python -m app.run_consumer
  #   env_file:
  #     - .env
  #   depends_on:
  #     - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    env_file:
      - .env
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16
    container_name: nepse_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  spark:
    image: apache/spark:3.5.1
    container_name: nepse_spark
    user: root
    depends_on:
      - kafka
      - postgres
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "/opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      spark_jobs/stream_processor.py"

volumes:
  postgres_data:
